[package]
name        = "lan-cowork"
version     = "0.1.0"
edition     = "2021"
license     = "MIT"
description = "LAN peer pairing, fleet dispatch and cross-node cowork routes. Host-agnostic axum routes behind a LanCoworkHost trait."
repository  = "https://github.com/eauesque/yu-lan-cowork"

# Dependency versions are pinned to match the yu_ai_manager workspace this crate
# is developed in. They are written out explicitly here because a standalone
# crate has no workspace to inherit from; keep them in step when either side
# moves.

[dependencies]
libc           = "0.2"
axum           = { version = "0.8", features = ["macros", "multipart"] }
tokio          = { version = "1", features = ["full", "test-util"] }
sqlx           = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
# `gzip`: an intermediary that compresses the import ZIP response would
# otherwise hand us raw gzip bytes, the archive would fail to parse, and the
# whole chunk would degrade to per-file downloads for no reason. Without the
# feature reqwest neither advertises nor decodes it; with it, both. The Python
# side has always decoded Content-Encoding (httpx does it by default), so this
# also removes a behavioural split between the two implementations.
reqwest        = { version = "0.12", default-features = false, features = ["json", "cookies", "stream", "rustls-tls", "gzip"] }
url            = "2"
thiserror      = "2"
sha2           = "0.10"
hmac           = "0.12"
rand           = { version = "0.9", features = ["os_rng"] }
tower-sessions = { version = "0.15", features = ["memory-store"] }
hex            = "0.4"
base64         = "0.22"
tower-http     = { version = "0.6", features = ["fs"] }
chrono         = { version = "0.4", features = ["serde"] }
uuid           = { version = "1", features = ["v4"] }
futures-util   = "0.3"
async-trait    = "0.1"
regex          = "1"
subtle         = "2"
tracing        = "0.1"
openssl        = "0.10"
indexmap       = { version = "2", features = ["serde"] }
scrypt         = { version = "0.11", default-features = false }
tokio-util     = { version = "0.7", features = ["io"] }
socket2        = "0.6"
tempfile       = "3"
zip            = { version = "9.1.3", default-features = false, features = ["deflate"] } # import ZIP (MIT OR Apache-2.0)
dirs           = "5"
urlencoding    = "2"

[dev-dependencies]
tower = "0.5"

# Test seams that production code must not contain. `TEST_ALLOW_LOOPBACK` makes
# loopback addresses pass a network reachability guard, `TEST_DESCRIPTOR`
# replaces local descriptor resolution outright, `PeerRegistry::insert_for_test`
# writes a peer straight into the in-memory trust registry, and `sign_headers`
# signs peer-transport headers. Each is compiled only under `cfg(test)` or this
# feature, so a normal dependent build cannot reach them. Never enable it from
# `[dependencies]`; a host that needs them in its own integration tests should
# enable it from `[dev-dependencies]` only.
[features]
test-seams = []
